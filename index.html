<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Dynamics Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
</head>
<body>
    <h1>Complex Dynamics Visualizer</h1>
    
    <div id="controls">
        <div class="input-group">
            <label for="numerator">Numerator P(z):</label>
            <input type="text" id="numerator" value="z^2 - 1">
        </div>
        <div class="input-group">
            <label for="denominator">Denominator Q(z):</label>
            <input type="text" id="denominator" value="1">
        </div>
        
        <div class="input-group">
            <label for="xMin">x-Min:</label>
            <input type="number" id="xMin" value="-2" step="0.5">
        </div>
        <div class="input-group">
            <label for="xMax">x-Max:</label>
            <input type="number" id="xMax" value="2" step="0.5">
        </div>
        <div class="input-group">
            <label for="yMin">y-Min:</label>
            <input type="number" id="yMin" value="-2" step="0.5">
        </div>
        <div class="input-group">
            <label for="yMax">y-Max:</label>
            <input type="number" id="yMax" value="2" step="0.5">
        </div>

        <div id="tool-controls">
            <div class="input-group">
                <label for="brush-size">Brush Size: <span id="brush-size-label">20</span>px</label>
                <input type="range" id="brush-size" min="1" max="50" value="20">
            </div>
            <button id="brush-tool" class="tool-btn">Brush</button>
            <button id="eraser-tool" class="tool-btn">Eraser</button>
            <button id="zoom-tool" class="tool-btn">Zoom</button>
        </div>

        <div id="action-buttons">
            <button id="start-reset">Start / Reset</button>
            <button id="iterate">Iterate</button>
            <button id="reverse">Reverse</button>
            <button id="unzoom-btn" disabled>Unzoom</button>
        </div>

        <div id="overlay-controls" class="input-group" style="flex-direction: row; gap: 10px;">
            <button id="toggle-equi" class="tool-btn">Show Equipotentials</button>
            <button id="toggle-rays" class="tool-btn">Show External Rays</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="main-canvas" width="800" height="800"></canvas>
        <canvas id="foreground-canvas" width="800" height="800"></canvas>
        <div id="status-indicator" class="hidden">Generating Julia Set...</div>
        <div id="zoom-rect" style="display: none;"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
